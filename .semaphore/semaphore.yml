version: v1.0
name: Initial Pipeline
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: 'Block #1'
    task:
      jobs:
        - name: 'Job #1'
          commands:
            - checkout
            - cd 1-monitor-kubernetes
            - 'helm repo add prometheus-community https://prometheus-community.github.io/helm-charts'
            - helm repo update
            - kubectl create namespace balkan
            - helm install monitoring prometheus-community/kube-prometheus-stack --namespace balkan --values monitoring-config.yml
      secrets:
        - name: kubeconfig
