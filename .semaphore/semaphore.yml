version: v1.0
name: Initial Pipeline
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: 'Block #11'
    task:
      jobs:
        - name: 'Job #1'
          commands:
            - checkout
            - cd 2-monitor-app
            - echo $DOCKER_PASSWORD | docker login --username "$DOCKER_USERNAME" --password-stdin
            - 'docker build -t "$DOCKER_USERNAME"/metrics-app:latest .'
            - 'docker push "$DOCKER_USERNAME"/metrics-app:latest'
            - kubectl apply -k kubernetes
      secrets:
        - name: dokse
        - name: kubeconfig
  - name: 'Block #2'
    task:
      secrets:
        - name: kubeconfig
      jobs:
        - name: 'Job #1'
          commands:
            - checkout
            - cd 1-monitor-kubernetes
            - helm uninstall prometheus-community/kube-prometheus-stack --namespace balkan || true
